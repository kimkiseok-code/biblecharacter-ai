<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 완료 — BibleCharacter.AI</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1A1610; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Pretendard', sans-serif; padding: 20px; }
.box { background: #FAF6EC; border: 1px solid rgba(184,149,42,0.4); border-radius: 18px; padding: 40px 32px; max-width: 380px; width: 100%; text-align: center; }
.icon { font-size: 40px; margin-bottom: 12px; }
.divider { width: 40px; height: 2px; background: #B8952A; margin: 0 auto 16px; border-radius: 2px; }
.title { font-size: 20px; font-weight: 700; color: #2A2318; margin-bottom: 10px; }
.desc { font-size: 13px; color: #5A4E3A; line-height: 1.8; margin-bottom: 28px; }
.btn { display: block; width: 100%; background: #B8952A; border: none; border-radius: 12px; padding: 14px; font-family: 'Pretendard', sans-serif; font-size: 14px; font-weight: 700; color: #2A2318; cursor: pointer; text-decoration: none; }
.btn:hover { background: #9A7A1E; }
.loading { font-size: 13px; color: #8A7A60; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">✦</div>
  <div class="divider"></div>
  <div class="title">결제가 완료됐어요!</div>
  <div class="desc" id="desc">잠시만 기다려 주세요...<br>이용권을 확인하고 있습니다.</div>
  <div class="loading" id="loading">처리 중...</div>
  <a href="/" class="btn" id="homeBtn" style="display:none;">말씀 멘토링 시작하기 🙏</a>
</div>

<script>
// 이용권은 서버(/api/nicepay-confirm)에서 이미 부여됨 → 여기서는 결과만 확인해서 보여줌
(async function() {
  const desc = document.getElementById('desc');
  const loading = document.getElementById('loading');
  const homeBtn = document.getElementById('homeBtn');
  const plan = new URLSearchParams(window.location.search).get('plan');

  function done(html) {
    desc.innerHTML = html;
    loading.style.display = 'none';
    homeBtn.style.display = 'block';
  }

  let tier = plan;
  let expiresAt = null;
  try {
    const saved = JSON.parse(localStorage.getItem('bca_user') || 'null');
    const headers = saved && saved.session ? { Authorization: 'Bearer ' + saved.session } : {};
    const res = await fetch('/api/me', { headers });
    if (res.ok) {
      const me = await res.json();
      if (me.tier === 'basic' || me.tier === 'premium') { tier = me.tier; expiresAt = me.expiresAt; }
    }
  } catch (e) {}

  const until = expiresAt
    ? '<br><span style="font-size:12px;color:#8A7A60;">이용기간: ' + new Date(expiresAt).toLocaleDateString('ko-KR') + '까지 · 자동결제 없이 자동 종료</span>'
    : '';

  if (tier === 'premium') {
    done('프리미엄 한 달 이용권이 활성화됐어요!<br>이용기간 동안 월 200회(매일 최대 30회) 말씀을 나눌 수 있습니다. 🙏' + until);
  } else if (tier === 'basic') {
    done('베이직 한 달 이용권이 활성화됐어요!<br>이용기간 동안 50회 대화를 이용하실 수 있습니다. 🙏' + until);
  } else {
    done('결제는 완료됐지만 이용권 확인이 늦어지고 있어요.<br>잠시 후 홈에서 다시 확인해 주시고, 계속 안 되면 010-5469-0568로 문의해 주세요.');
  }
})();
</script>
</body>
</html>
